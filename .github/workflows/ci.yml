name: C++ Build, Tests and Graph Examples

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Run all module and integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Run the three graph examples and the full-library example
        working-directory: build
        run: |
          ./histogram_example
          ./kdeplot_example
          ./countplot_example
          ./complete_library_example
          test -s ../data/output/histogram_example.svg
          test -s ../data/output/kdeplot_example.svg
          test -s ../data/output/countplot_example.svg
          test -s ../data/output/complete_histogram.svg
          test -s ../data/output/complete_kdeplot.svg
          test -s ../data/output/complete_countplot.svg

  windows-native-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure the C++ Windows desktop application
        run: cmake -S . -B build
      - name: Build the library and native Graph Studio
        run: cmake --build build --config Debug --parallel
      - name: Run library tests
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Check that the C++ desktop UI was built
        shell: pwsh
        run: |
          if (-not (Test-Path "build/Debug/graph_studio.exe") -and
              -not (Test-Path "build/graph_studio.exe")) {
            throw "The Windows C++ Graph Studio executable was not built."
          }
